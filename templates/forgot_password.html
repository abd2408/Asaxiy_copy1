<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Parolni unutdingizmi - Asaxiy</title>
</head>
<body>
    <h1>Parolni unutdingizmi?</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Davom etish</button>
    </form>

    <p><a href="{% url 'login' %}">← Kirishga qaytish</a></p>
</body>
</html>
